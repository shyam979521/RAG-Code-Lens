<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recover account — RAG CodeLens</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}"></head><body class="auth-page"><main class="auth-shell card glass"><aside class="auth-aside"><a class="brand" href="/"><span class="brand-mark">◈</span> RAG CodeLens</a><div><span class="eyebrow">Account recovery</span><h1>We’ll help you get back in.</h1><p>Password delivery will be available when email infrastructure is configured.</p></div></aside><section class="auth-panel" aria-labelledby="forgot-title"><h2 id="forgot-title">Reset your password</h2><p>Enter your email to request recovery instructions.</p>{% if msg %}<div class="form-message success" role="status">{{ msg }}</div>{% endif %}<form class="auth-form" data-auth-form method="POST" novalidate><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required aria-describedby="email-error"><p id="email-error" class="field-error" data-error-for="email"></p></div><button class="button button-primary auth-submit" type="submit">Request recovery</button></form><p class="auth-footer"><a class="auth-link" href="/login">Back to sign in</a></p></section></main><script src="{{ url_for('static', filename='js/auth.js') }}" defer></script></body></html>
