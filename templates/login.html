<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Cortex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #030712;
            color: #F9FAFB;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Background Effects */
        .background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .grid-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(79, 70, 229, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(79, 70, 229, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            animation: orbFloat 25s ease-in-out infinite;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle at center, #4F46E5, transparent 70%);
            top: -200px;
            left: -200px;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle at center, #10B981, transparent 70%);
            bottom: -150px;
            right: -150px;
            animation-delay: 8s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle at center, #8B5CF6, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 15s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.4; }
            33% { transform: translate(100px, 100px) scale(1.2); opacity: 0.6; }
            66% { transform: translate(-50px, -50px) scale(0.8); opacity: 0.3; }
        }

        .neon-lines {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .neon-line {
            position: absolute;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, #4F46E5, #10B981, #8B5CF6, transparent);
            opacity: 0.3;
            animation: neonPulse 5s ease-in-out infinite;
        }

        .neon-line:nth-child(1) { left: 15%; }
        .neon-line:nth-child(2) { left: 40%; animation-delay: 1.5s; }
        .neon-line:nth-child(3) { left: 60%; animation-delay: 3s; }
        .neon-line:nth-child(4) { left: 85%; animation-delay: 4.5s; }

        @keyframes neonPulse {
            0%, 100% { opacity: 0.2; transform: scaleY(0.9); filter: blur(1px); }
            50% { opacity: 0.5; transform: scaleY(1.1); filter: blur(2px); }
        }

        /* Login Container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 450px;
            margin: 2rem;
        }

        .login-card {
            background: rgba(17, 24, 39, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(79, 70, 229, 0.4);
            border-radius: 32px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(79, 70, 229, 0.1);
            transition: all 0.3s ease;
        }

        .login-card:hover {
            border-color: rgba(79, 70, 229, 0.6);
            box-shadow: 0 30px 60px -15px rgba(79, 70, 229, 0.2);
        }

        /* Logo */
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-icon {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
        }

        .logo-icon svg {
            width: 45px;
            height: 45px;
            filter: drop-shadow(0 0 15px rgba(79, 70, 229, 0.6));
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4F46E5, #10B981, #8B5CF6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        /* Header */
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #F9FAFB, #9CA3AF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .login-header p {
            color: #9CA3AF;
            font-size: 0.95rem;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #D1D5DB;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #6B7280;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.9rem 1rem 0.9rem 2.8rem;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 14px;
            color: #F9FAFB;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #4F46E5;
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }

        .input-wrapper input::placeholder {
            color: #4B5563;
        }

        /* Password Toggle */
        .password-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #6B7280;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #4F46E5;
        }

        /* Error Message */
        .error-message {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: #F87171;
        }

        .error-message i {
            font-size: 1rem;
        }

        /* Success Message */
        .success-message {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.85rem;
            color: #34D399;
        }

        .success-message i {
            font-size: 1rem;
        }

        /* Button */
        .login-btn {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #4F46E5, #8B5CF6);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4);
        }

        /* Forgot Password */
        .forgot-password {
            text-align: right;
            margin-top: 0.5rem;
        }

        .forgot-password a {
            color: #6B7280;
            font-size: 0.8rem;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password a:hover {
            color: #4F46E5;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 1.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(79, 70, 229, 0.2);
        }

        .login-footer p {
            color: #9CA3AF;
            font-size: 0.9rem;
        }

        .login-footer a {
            color: #4F46E5;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-footer a:hover {
            color: #8B5CF6;
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .login-card {
                padding: 1.8rem;
            }
            .login-header h1 {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="background-container">
        <div class="grid-overlay"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="neon-lines">
            <div class="neon-line"></div>
            <div class="neon-line"></div>
            <div class="neon-line"></div>
            <div class="neon-line"></div>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo -->
            <div class="logo">
                <a href="/" class="logo-icon">
                    <svg viewBox="0 0 100 100" fill="none">
                        <path d="M50 5 L85 25 L85 75 L50 95 L15 75 L15 25 L50 5" 
                              stroke="url(#gradient)" 
                              stroke-width="3" 
                              fill="rgba(79,70,229,0.2)"/>
                        <path d="M35 35 Q 50 25, 65 35 Q 75 45, 65 65 Q 50 75, 35 65" 
                              stroke="white" 
                              stroke-width="4" 
                              fill="none"/>
                        <circle cx="50" cy="50" r="10" fill="url(#gradient)" opacity="0.3">
                            <animate attributeName="r" values="10;15;10" dur="3s" repeatCount="indefinite"/>
                        </circle>
                        <defs>
                            <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#4F46E5"/>
                                <stop offset="100%" stop-color="#10B981"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="logo-text">CORTEX</span>
                </a>
            </div>

            <!-- Header -->
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Sign in to continue to Cortex</p>
            </div>

            <!-- Error/Success Messages -->
            {% if error %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% if msg %}
            <div class="success-message">
                <i class="fas fa-check-circle"></i>
                <span>{{ msg }}</span>
            </div>
            {% endif %}

            <!-- Login Form -->
            <form action="/do-login" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" name="email" placeholder="you@example.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" id="password" placeholder="Enter your password" required>
                        <i class="fas fa-eye-slash password-toggle" onclick="togglePassword()"></i>
                    </div>
                </div>

                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fas fa-arrow-right"></i> Sign In
                </button>
            </form>

            <!-- Footer -->
            <div class="login-footer">
                <p>Don't have an account? <a href="/register">Create account</a></p>
            </div>
        </div>
    </div>

    <script>
        // Password visibility toggle
        function togglePassword() {
            const passwordField = document.getElementById('password');
            const icon = document.querySelector('.password-toggle');
            
            if (passwordField.type === "password") {
                passwordField.type = "text";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            } else {
                passwordField.type = "password";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            }
        }

        // Check for messages on load
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const msg = urlParams.get('msg');
        
        if (error) {
            document.querySelector('.error-message')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        if (msg) {
            document.querySelector('.success-message')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    </script>
</body>
</html>
