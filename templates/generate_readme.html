<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generated README - Cortex</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #030712;
            color: #F9FAFB;
        }
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(3, 7, 18, 0.98);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(79, 70, 229, 0.4);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #4F46E5, #10B981);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links a {
            color: #9CA3AF;
            text-decoration: none;
            margin-left: 2rem;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 100px 2rem 4rem;
        }
        .back-link {
            color: #4F46E5;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 1.5rem;
        }
        .readme-box {
            background: rgba(17, 24, 39, 0.8);
            border: 1px solid rgba(79, 70, 229, 0.3);
            border-radius: 16px;
            padding: 2rem;
        }
        .readme-content {
            line-height: 1.8;
            white-space: pre-wrap;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
        }
        .copy-btn {
            margin-top: 1rem;
            padding: 0.5rem 1rem;
            background: #4F46E5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">CORTEX</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/ask">Ask AI</a>
        </div>
    </nav>

    <div class="container">
        <a href="/dashboard" class="back-link">← Back to Dashboard</a>
        
        <div class="readme-box">
            <h2><i class="fas fa-file-alt"></i> AI Generated README</h2>
            <div class="readme-content" id="readmeContent">{{ readme }}</div>
            <button class="copy-btn" onclick="copyToClipboard()"><i class="fas fa-copy"></i> Copy to Clipboard</button>
        </div>
    </div>

    <script>
        function copyToClipboard() {
            const content = document.getElementById('readmeContent').innerText;
            navigator.clipboard.writeText(content);
            alert('README copied to clipboard!');
        }
    </script>
</body>
</html>
