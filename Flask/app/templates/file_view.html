{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h1>{{ file.filename }}</h1>
    <a href="/explain-file?id={{ file.id }}" class="btn">Explain this File</a>
</div>
<div class="card">
    <pre><code>{{ file.content }}</code></pre>
</div>
{% endblock %}
