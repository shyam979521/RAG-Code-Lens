{% extends "base.html" %}
{% block content %}
<h1>Upload Codebase</h1>
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form action="/process" method="post" enctype="multipart/form-data">
        <label for="file" style="display: block; margin-bottom: 0.5rem;">Select ZIP file:</label>
        <input type="file" name="file" id="file" accept=".zip" required>
        <button type="submit" class="btn" style="width: 100%;">Upload & Process</button>
        <p style="margin-top: 1rem; font-size: 0.9rem; color: #94a3b8;">
            Note: Processing may take a few minutes depending on the size of the codebase.
        </p>
    </form>
</div>
{% endblock %}
